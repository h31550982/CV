  <script>
    (function () {
      const form = document.getElementById("gate");
      const input = document.getElementById("gate-password");
      const error = document.getElementById("gate-error");
      const button = form.querySelector("button");
      const fromB64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

      async function decrypt(password) {
        const payload = JSON.parse(document.getElementById("cv-data").textContent);
        const salt = fromB64(payload.salt);
        const iv = fromB64(payload.iv);
        const tag = fromB64(payload.tag);
        const data = fromB64(payload.data);

        const baseKey = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]);
        const bits = new Uint8Array(await crypto.subtle.deriveBits(
          { name: "PBKDF2", hash: "SHA-256", salt, iterations: payload.iterations }, baseKey, 512
        ));

        const macKey = await crypto.subtle.importKey("raw", bits.slice(32), { name: "HMAC", hash: "SHA-256" }, false, ["verify"]);
        const signed = new Uint8Array(iv.length + data.length);
        signed.set(iv);
        signed.set(data, iv.length);
        if (!(await crypto.subtle.verify("HMAC", macKey, tag, signed))) return null;

        const encKey = await crypto.subtle.importKey("raw", bits.slice(0, 32), "AES-CBC", false, ["decrypt"]);
        const plain = await crypto.subtle.decrypt({ name: "AES-CBC", iv }, encKey, data);
        return new TextDecoder().decode(plain);
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        error.textContent = "";
        button.disabled = true;
        try {
          const html = await decrypt(input.value);
          if (html === null) {
            error.textContent = "Väärä salasana";
            input.select();
            return;
          }
          form.remove();
          document.body.classList.remove("is-locked");
          document.body.insertAdjacentHTML("afterbegin", html);
          const script = document.createElement("script");
          script.src = "main.js";
          document.body.appendChild(script);
        } catch (e) {
          error.textContent = "Sivun avaaminen ei onnistunut";
        } finally {
          button.disabled = false;
        }
      });
    })();
  </script>
